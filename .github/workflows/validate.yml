name: Validate skills
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_repository.py
      - name: Check iOS shell script syntax
        run: bash -n tools/ios/Start-Sonoma-Installer.sh && bash -n tools/ios/Start-Sonoma-Verbose.sh
